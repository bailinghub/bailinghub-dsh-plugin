name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify_matrix:
    name: verify (${{ matrix.os }}, ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        node:
          - '22.19.0'
          - '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm pack --dry-run

  verify:
    name: verify
    if: ${{ always() }}
    needs:
      - verify_matrix
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and Node.js matrix job to pass
        run: test "${{ needs.verify_matrix.result }}" = "success"
