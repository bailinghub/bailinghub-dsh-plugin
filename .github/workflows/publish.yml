name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:release-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: npm run verify
      - name: Check exact npm publication before publishing
        id: npm-version
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node scripts/wait-npm-publication.mjs --before-publish >> "$GITHUB_OUTPUT"
      - name: Publish npm package with trusted publishing
        if: steps.npm-version.outputs.published != 'true'
        run: npm publish --access public
      - name: Wait for exact npm publication and verify source identity
        if: steps.npm-version.outputs.published != 'true'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/wait-npm-publication.mjs
