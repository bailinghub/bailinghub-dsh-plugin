name: Publish

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Use npm with trusted publishing support
        run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check:release-tag
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
      - run: npm run verify
      - name: Publish when the exact version is not present
        shell: bash
        run: |
          package_name="$(node --print "require('./package.json').name")"
          package_version="$(node --print "require('./package.json').version")"
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            echo "${package_name}@${package_version} already exists"
          else
            npm publish --access public
          fi
